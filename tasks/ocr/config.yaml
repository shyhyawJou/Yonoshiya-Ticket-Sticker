mode: preset_roi
includes:
    classes: classes.yaml
    menus_mapping: menus_mapping.yaml
mqtt:
    host: localhost
    port: 1883
    base_topic: ocr
    session: v1
runtime:
    model:
        object_det: ./mmr_10cls_v01_00.dla
        ocr_det: ./yoshi_det_v01_02.dla
        ocr_cls: ./cls_v2.dla
        ocr_rec: ./yoshi_rec_v01_04.dla
        text: ./japan_dict.txt
    camera:
        source: 0
        width: 4024
        height: 3036
        device: hik
    stream:
        port: 9527
        stream_size:
        - 1280
        - 960
thresholds:
    ai_conf: 0.5
    ai_iou: 0.4
placement:
    roi_strink: 0.1
    iou_assign: 0.3
    iou_candidate: 0.8
    drift_iou_thresh: 0.95
stability:
    n_settle_frame: 6
    k_container_fail: 3
    k_container_new: 15
    tray_missing_frame: 15
    sticker_missing_frame: 15
    ticket_leave_frame: 30
camera_params:
    aravis:
        GainAuto: 'Off'
        Gain: 5.0
        ExposureAuto: 'Off'
        ExposureTime: 75000.0
        BalanceWhiteAuto: Continuous
    hik:
        DeviceLinkThroughputLimitPercentage:
            value: 70
            type: int
        AcquisitionFrameRateEnable:
            value: true
            type: bool
        AcquisitionFrameRate:
            value: 15.0
            type: float
        BalanceWhiteAuto:
            value: Continuous
            default: Continuous
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        ExposureMode:
            value: Timed
            type: string
        ExposureAuto:
            value: Continuous
            default: 'Off'
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        ExposureTime:
            value: 50000.0
            default: 75000.0
            type: float
            max: 500000
            min: 20
        GainAuto:
            value: 'Off'
            default: 'Off'
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        Gain:
            value: 5.0
            default: 6.0
            type: float
            max: 23.981199264526367
            min: 0.0
preset_roi:
    ticket_roi:
        points:
            - [500, 1000]
            - [1600, 1000]
            - [1600, 2500]
            - [500, 2500]
        color: [0, 255, 255]   # BGR,黃色,前端 overlay 用

    # 之後要用到辨識物件 ROI 時再打開:
    # object_roi:
    #     points:
    #         - [x1, y1]
    #         - [x2, y2]
    #         - [x3, y3]
    #         - [x4, y4]

    # 之後要用到打包完成 ROI 時再打開:
    # packing_roi:
    #     points:
    #         - [x1, y1]
    #         - [x2, y2]
    #         - [x3, y3]
    #         - [x4, y4]