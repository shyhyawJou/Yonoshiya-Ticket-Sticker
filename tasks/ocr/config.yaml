mode: preset_roi
includes:
    classes: classes.yaml
    menus_mapping: menus_mapping.yaml
mqtt:
    host: localhost
    port: 1883
    base_topic: ocr
    session: v1
runtime:
    model:
        object_det: ./mmr_11cls_v01_00.dla
        ocr_det: ./yoshi_det_v01_02.dla
        ocr_cls: ./cls_v2.dla
        ocr_rec: ./yoshi_rec_v01_04.dla
        text: ./japan_dict.txt
    camera:
        source: 0
        width: 4024
        height: 3036
        device: hik
    stream:
        port: 9527
        stream_size:
        - 1280
        - 960
thresholds:
    ai_conf: 0.5
    ai_iou: 0.4
placement:
    roi_strink: 0.1
    iou_assign: 0.3
    iou_candidate: 0.8
    drift_iou_thresh: 0.95
stability:
    n_settle_frame: 6
    k_container_fail: 3
    k_container_new: 15
    tray_missing_frame: 15
    sticker_missing_frame: 15
    ticket_leave_frame: 30
camera_params:
    aravis:
        GainAuto: 'Off'
        Gain: 5.0
        ExposureAuto: 'Off'
        ExposureTime: 75000.0
        BalanceWhiteAuto: Continuous
    hik:
        DeviceLinkThroughputLimitPercentage:
            value: 70
            type: int
        AcquisitionFrameRateEnable:
            value: true
            type: bool
        AcquisitionFrameRate:
            value: 15.0
            type: float
        BalanceWhiteAuto:
            value: Continuous
            default: Continuous
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        ExposureMode:
            value: Timed
            type: string
        ExposureAuto:
            value: Continuous
            default: Continuous
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        ExposureTime:
            value: 50000.0
            default: 75000.0
            type: float
            max: 500000
            min: 20
        GainAuto:
            value: 'Off'
            default: Continuous
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        Gain:
            value: 10.4
            default: 6.0
            type: float
            max: 23.981199264526367
            min: 0.0
        GammaEnable:
            value: true
            type: bool
        Brightness:
            value: 80
            default: 80
            type: int
            max: 255
            min: 0
        ReverseX:
            value: false
            type: bool
        ReverseY:
            value: false
            type: bool
depth_camera:
    id: 0
    max_depth_mm: 1200
    fps_log_interval: 10 # 秒
birghtness_controller:
    golden_img: tasks/ocr/golden_brightness.png
    roi: null
    exposure_safety_margin: 0.85
    tolerance: 3.0
    max_step_ratio: 2.0
    overexposed_guard: null
    underexposed_guard: null
    check_interval: 1
    crtl_interval: 0.5
preset_roi:
    ticket_roi:
        points:
        -   - 400
            - 1400
        -   - 1600
            - 1400
        -   - 1600
            - 2800
        -   - 400
            - 2800
        color:
        - 0
        - 255
        - 255
