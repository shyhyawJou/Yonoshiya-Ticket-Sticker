# ja_readings.yaml —— 通用日文「同詞異寫」折疊規則（跨客戶共用）
#
# 這份檔案刻意放在 tasks/ocr/ 這一層而不是某個品牌目錄底下，因為它描述的是
# 日文本身的字/詞讀音，跟哪一家客戶無關 —— 跟 ../mmr_11cls_v01_02.dla 等
# 共用資源同一個層級。各品牌專屬的菜單命名慣例請寫在
# tasks/ocr/<brand>/menu_aliases.yaml，不要寫在這裡。
#
# 用途：logic/menu_alias.py 的 fold() 會套用這些規則產生「只用於比對」的 key。
#       產生的 key 永遠不會被顯示、發 MQTT 或寫進 CSV。
#
# 規則語意：把 from 的字串取代為 to。長規則先套用、短規則後套用，所以可以
#           用組合達成收斂，例如：
#               揚げ -> 揚、揚 -> あげ、唐 -> から
#           會讓 唐揚げ / から揚げ / から揚 / 唐揚 / からあげ 全部折成 からあげ。
#
# 新增規則的規矩（很重要）：
#   1. 每加一條就跑 `python3 tools/verify_menu_alias.py`，確認沒有產生新的
#      危險合併。錯誤合併會讓錯餐點被靜默判為 MATCHED，比漏合併嚴重得多。
#   2. 數量詞與份量詞（３個/６個、並/大/特/頭/超特盛…）永遠不要寫進這裡；
#      menu_alias.py 的 guard_signature() 對這兩個軸有硬性護欄。
#   3. tag 只是給人看的來源分類，程式不使用：
#        ja      純日文讀音
#        gyudon  牛丼/定食業態行話（ツユダク、アタマ 之類）
#
# 初版規則是 2026-09-16 從 tasks/ocr/yoshinoya/menus_mapping.yaml 既有的
# 1139 列「傳票寫法 vs 貼紙寫法」自動挖掘、再人工核對出來的。

readings:
  # --- 送假名正規化（先跑，長規則優先）---
  - { from: 揚げ,   to: 揚,     tag: ja }
  - { from: 焼き,   to: 焼,     tag: ja }
  - { from: 盛り,   to: 盛,     tag: ja }

  # 「盛」是可省略的份量後綴：小盛=小、大盛=大、並盛=並、特盛=特、超特盛=超特。
  # 2026-09-18 現場回報同一份餐被 牛丼小 / 牛丼小盛 當成兩份。
  # 這是通用規則而不是個案，所以放這裡而不是某個品牌的 menu_aliases.yaml ——
  # 一條規則就涵蓋所有 X / X盛，客戶菜單以後新增 Y大盛 也不用再補。
  # dry-run：傳票 1069->1017、貼紙 358->344（共 66 群合併），護欄衝突 0，
  # suzumo 完全不受影響。
  - { from: 盛,     to: "",     tag: ja }

  # --- 漢字 -> 假名讀音 ---
  - { from: 唐,     to: から,   tag: ja }    # 唐揚げ / から揚げ（22 次出現）
  - { from: 揚,     to: あげ,   tag: ja }
  - { from: 皿,     to: さら,   tag: ja }    # 牛皿 / 牛ｻﾗ（15 次出現）
  - { from: 焼,     to: やき,   tag: ja }
  - { from: 鳥,     to: とり,   tag: ja }    # 焼鳥 / 焼き鳥 / やきとり
  - { from: 豚,     to: とん,   tag: ja }    # 豚汁 / とん汁
  - { from: 飯,     to: はん,   tag: ja }    # ご飯 / ごはん
  - { from: 汁,     to: しる,   tag: ja }    # みそ汁 / 味噌汁
  - { from: 味噌,   to: みそ,   tag: ja }
  - { from: 玉子,   to: たまご, tag: ja }    # 玉子 / たまご
  - { from: 卵,     to: たまご, tag: ja }

  # --- 牛丼業態行話 ---
  - { from: 多,     to: だく,   tag: gyudon }  # ﾂﾕ多 / ﾂﾕﾀﾞｸ（5 次出現）
  - { from: 頭,     to: あたま, tag: gyudon }  # アタマ = 頭（肉多め）
