# ja_ticket_grammar.yaml —— 日文傳票的「修飾列」文法（跨品牌共用）
#
# 這份檔案跟 ja_readings.yaml 同一層、同一種性質：通用的日文規則，
# 一次核准、長期適用，不屬於任何單一客戶。
#
# ---------------------------------------------------------------------------
# 重要：這份檔案**不做認定，只做提案**
# ---------------------------------------------------------------------------
# 「某個傳票菜名是不是修飾列、它換掉的是哪一軸」一律由各品牌的
# menu_modifiers.yaml 的 substitutions 台帳決定（人工判定一次、永久記錄）。
#
# 理由：光看字串無法知道換的是哪一軸。實際資料裡 `変更半熟` 的貼紙就是
# `半熟玉子`，跟單品的 `半熟玉子` 一模一樣 —— 是「把套餐的生玉子換成半熟」
# 還是「加點一份半熟玉子」，字串上分不出來，必須有人決定一次。
#
# 那這份檔案做什麼？
#   1. tools/verify_menu_modifiers.py 用它掃 menus_mapping.yaml，
#      把「看起來像修飾列但台帳還沒登記」的列印成可直接貼進 yaml 的提案。
#      客戶 xlsx 改版新增變更品項時，不會靜默漏掉。
#   2. 未來給「傳票只印 変) 而菜單裡查不到這個名字」的救援路徑用：
#      去掉修飾前綴後把殘餘字串再比對一次。
#
# ---------------------------------------------------------------------------

# 修飾列的寫法。每條 regex 必須有一個名為 item 的 group，抓出「被代入的品名」。
# 實測涵蓋 menus_mapping.yaml（吉野家 1222 列）裡全部 25 個修飾列寫法。
substitute_patterns:
  # 変更しじみ汁 / 変更とん汁 / 変更ポテトサラダ / 変更半熟 / 変更ご飯軽め
  - '^変更(?P<item>.+)$'
  # しじみ汁に変更 / とん汁に変更 / 冷汁に変更
  - '^(?P<item>.+)に変更$'
  # 少數版面把変更放在後面
  - '^(?P<item>.+)変更$'
  # 変)ご飯増量(無料) / 変)麦飯増量(無料) / 変)ご飯軽め
  # 全角與半角括號都收，OCR 兩種都可能讀到
  - '^変[)）](?P<item>.+)$'

# 通路/販售型態前綴。比對 substitute_patterns 之前先剝掉，會反覆剝除
# （實際資料出現過 `D)変)ご飯増量(無料)` 這種疊加）。
#
# 剝掉的只是「拿來比對文法」的副本；台帳與菜單比對用的都是完整原字串，
# 所以 D)変更豚汁 與 変更豚汁 仍然是兩筆各自獨立的菜單品項。
ignore_prefixes:
  - 'D)'      # デリバリー（外送）
  - 'D）'
  - '単)'     # 單品販售
  - '単）'
  - '☆'
  - '*'
  - '※'

# 貼紙側的「已變更」標記。菜單裡的變更貼紙印成 ※変更しじみ / 変更純豆腐S，
# 需要把標記還原回品名時（例如稽核工具要判斷它落在哪一軸）先去掉這些。
sticker_markers:
  - '※変更'
  - '※'
  - '変更'
