# ==============================================================================
# 吉野家 沙拉日期標籤（logic/readers/date_label.py）
# ==============================================================================
# 點サラダ時，旁邊常會多貼一張小標籤：小字「サラダ」、「保存方法 10℃以下 / 消費期限」，
# 底下是大字的日期（26. 8. 8）與時間（16:27）。偵測器一樣框成 order_sticker。
#
# 打開後：
#   - rec 讀到合法的日期（YY.M.D）或時間（HH:MM）、其他框又沒對到別的菜名，就當成日期標籤
#   - 一般サラダ貼紙與日期標籤任一張都能代表那份サラダ；另一張進來就跟它成組，不重複計數
#   - 日期時間只印 log（[沙拉日期] サラダ(模板0.95):26.8.8-16:27），CSV 不動
# 關閉（或這個檔案不存在）= 日期標籤照一般貼紙比對（只讀到日期時間會發 Unknown）。
# app 啟動時讀，改了要重啟（參考圖也是啟動時載入）。

enabled: true

# 這張標籤代表的品項（貼紙上的名稱，要在 menus_mapping.yaml 的 sub_items 裡）
item: サラダ

# 參考圖輔助（logic/readers/label_cv.py）：det 優先，CV 只補 det 缺的欄位、確認身份、交叉核對。
# 參考圖 = 這個資料夾裡轉正的標籤 crop，版面不用手標：每張自己用水平投影切列，
# fields 指定欄位是第幾列（負數從下面數），欄位上方的列（サラダ + 保存方法 / 消費期限）就是模板區。
# 新增參考圖只要把轉正的 crop 丟進來、重啟 app。
cv:
  enabled: true
  refs: "*.jpg"
  # 模板分數（TM_CCOEFF_NORMED）門檻，不到就不參與。2026-11-06 實驗機：
  # 沙拉日期標籤 0.93~0.99（7 張、四個方向）、一般貼紙最高 0.46（502 張）
  min_score: 0.75
  scales: [0.80, 1.25]   # 參考圖的縮放範圍（店家相機高度不同時字的大小會變）
  fields:
    date: -2             # 倒數第二列
    time: -1             # 最後一列
