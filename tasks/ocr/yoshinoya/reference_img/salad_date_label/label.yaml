# ==============================================================================
# 吉野家 沙拉日期標籤（logic/readers/date_label.py）
# ==============================================================================
# 點サラダ時，旁邊常會多貼一張小標籤：小字「サラダ」、「保存方法 10℃以下 / 消費期限」，
# 底下是大字的日期（26. 8. 8）與時間（16:27）。偵測器一樣框成 order_sticker。
#
# 打開後：
#   - rec 讀到合法的日期（YY.M.D）或時間（HH:MM）、其他框又沒對到別的菜名，**而且參考圖模板對到**，
#     才當成日期標籤（require_template）
#   - 原味 サラダ：一般貼紙與日期標籤任一張都能代表那份サラダ；另一張進來就跟它成組，不重複計數
#   - 口味沙拉（salad_items，ポテトサラダ 等）：一定有完整名稱的一般貼紙，日期標籤只能跟它成組、不能代替；
#     一般貼紙還沒到就先收著（不計數、不報錯）
#   - 這筆訂單沒有沙拉（或每份都已經配到日期標籤）：多的日期標籤照錯誤品項（サラダ）
#   - 日期時間只印 log（[沙拉日期] サラダ(模板0.82):26.8.8-16:27），CSV 不動
# 關閉（或這個檔案不存在）= 日期標籤照一般貼紙比對（只讀到日期時間會發 Unknown）。
# app 啟動時讀，改了要重啟（參考圖也是啟動時載入）。

enabled: true

# 原味沙拉：日期標籤本身就是它的貼紙（貼紙上的名稱，要在 menus_mapping.yaml 的 sub_items 裡）
item: サラダ

# 口味沙拉（2026-11-16 chris.fan 說明現場）：由貼紙菜單推導，名稱含 contain、不在 exclude 的（item 除外）。
# 啟動時 log 會列出推導結果（[沙拉日期] 口味沙拉 … 種）。2026-11 菜單：ポテトサラダ、ミニサラダ
#   exclude  確認不是沙拉的（サラダ抜き = 去掉沙拉）
salad_items:
  contain: サラダ
  exclude: [サラダ抜き]

# 一定要模板對到才算日期標籤（2026-11-16）。現場店內備料罐的保存期限標籤
# （72時間 / 26.11.16 / 15:58）被 det 讀出 26.11.16，就被當成 サラダ、報錯誤品項：
# 日期時間是所有保存期限標籤都有的，只靠它分不出是哪一種標籤。
# 模板沒對到的照一般貼紙比對（讀不出菜名 = Unknown，不擋完成），log 記
# 「讀到日期/時間 …，但模板沒對到，不當日期標籤」。
# false = 舊行為（模板沒對到時只靠 det 也算），cv 關掉時也只能用 false 才判定得出日期標籤。
require_template: true

# 參考圖輔助（logic/readers/label_cv.py）：det 優先讀字，CV 確認身份、補 det 缺的欄位、交叉核對。
# 參考圖 = 這個資料夾裡轉正的標籤 crop，版面不用手標：每張自己用水平投影切列，
# fields 指定欄位是第幾列（負數從下面數）。新增參考圖只要把轉正的 crop 丟進來、重啟 app。
cv:
  enabled: true
  refs: "*.jpg"
  # 模板區：日期列正上方 1 列小字（消費期限）+ 日期列本身，跳過最上面的品名列。
  # 2026-11-16 現場：サラダ 日期標籤被另一張貼紙壓住上半部時，含品名的模板（舊設定：欄位上方所有列）
  # 只有 0.45 對不到。品名跟小字黏成一列的參考圖切不出這一段，載入時略過（目前 6 張用 4 張）。
  template:
    rows_above: 1
    include: [date]
  # 模板分數（TM_CCOEFF_NORMED）門檻，不到就不參與。2026-11-16 實驗機（上面的模板區）：
  #   沙拉日期標籤 0.82、品名被壓住的沙拉日期標籤 0.81、
  #   備料罐保存期限標籤 0.32、一般貼紙最高 0.43（528 張）
  # 日期數字每張不同，所以比舊模板（含品名，沙拉 0.93~0.99）低；落在 0.6~0.7 的真標籤要回來調。
  min_score: 0.6
  scales: [0.80, 1.25]   # 參考圖的縮放範圍（店家相機高度不同時字的大小會變）
  fields:
    date: -2             # 倒數第二列
    time: -1             # 最後一列
