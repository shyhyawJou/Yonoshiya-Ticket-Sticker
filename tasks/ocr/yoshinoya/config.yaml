mode: preset_roi
includes:
    classes: classes.yaml
    menus_mapping: menus_mapping.yaml
mqtt:
    host: localhost
    port: 1883
    base_topic: ocr
    session: v1
runtime:
    model:
        object_det: ../mmr_11cls_v01_03.dla
        ocr_det: ../yoshi_det_v01_03.dla
        ocr_cls: ../cls_v2.dla
        ocr_rec: ../yoshi_rec_v01_07.dla
        text: ./japan_dict.txt
    camera:
        source: 0
        width: 4024
        height: 3036
        device: hik
    stream:
        port: 9527
        stream_size:
        - 1280
        - 960
thresholds:
    ai_conf: 0.5
    ai_iou: 0.4
placement:
    roi_strink: 0.1
    iou_assign: 0.3
    iou_candidate: 0.8
    drift_iou_thresh: 0.95
stability:
    n_settle_frame: 8
    k_container_fail: 3
    k_container_new: 15
    tray_missing_frame: 15
    sticker_missing_frame: 15
    ticket_leave_frame: 30
    still_shift_ratio: 0.05
    wrong_item_confirm: 2
    wrong_item_strong_score: 100
    wrong_item_strong_conf: 0.9
order_guard:
    timeout_sec: 600
    max_item_qty: 20
camera_params:
    aravis:
        GainAuto: 'Off'
        Gain: 5.0
        ExposureAuto: 'Off'
        ExposureTime: 75000.0
        BalanceWhiteAuto: Continuous
    hik:
        DeviceLinkThroughputLimitPercentage:
            value: 70
            type: int
        AcquisitionFrameRateEnable:
            value: true
            type: bool
        AcquisitionFrameRate:
            value: 15.0
            type: float
        BalanceWhiteAuto:
            value: Continuous
            default: Continuous
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        ExposureMode:
            value: Timed
            type: string
        ExposureAuto:
            value: Continuous
            default: Continuous
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        ExposureTime:
            value: 50000.0
            default: 75000.0
            type: float
            max: 500000
            min: 20
        GainAuto:
            value: 'Off'
            default: Continuous
            type: string
            allowed:
            - Continuous
            - Once
            - 'Off'
        Gain:
            value: 10.4
            default: 6.0
            type: float
            max: 23.981199264526367
            min: 0.0
        GammaEnable:
            value: true
            type: bool
        Brightness:
            value: 80
            default: 80
            type: int
            max: 255
            min: 0
        ReverseX:
            value: true
            type: bool
        ReverseY:
            value: true
            type: bool
depth_camera:
    enable: false
    id: 0
    max_depth_mm: 1200
    fps_log_interval: 5
    log_tag: Depth
    enable_fps_log: true
birghtness_controller:
    golden_img: tasks/ocr/golden_brightness.png
    roi: null
    exposure_safety_margin: 0.85
    tolerance: 3.0
    max_step_ratio: 2.0
    overexposed_guard: null
    underexposed_guard: null
    check_interval: 1
    crtl_interval: 0.5
preset_roi:
    ticket_roi:
        source: auto
        auto:
            class_name: ticket_mat
            padding_ratio: 0.12
            confirm_frames: 15
            stable_iou: 0.9
            timeout_frames: 600
            persist: true
        points:
        -   - 581
            - 1393
        -   - 1668
            - 1393
        -   - 1668
            - 2928
        -   - 581
            - 2928
        color:
        - 0
        - 255
        - 255
csv_log:
    root_dir: /mnt/reserved/record/stream
    folder: csv_logs
    video_category: event
    max_video_size: null
debug_sheet:
    enabled: true
    mode: all
    root_dir: ''
    folder: debug_sheet
    canvas_w: 4024
    canvas_h: 3036
    jpeg_quality: 85
    save_json: true
    font_path: ''
    max_entries: 80
    crop_max_side: 1600
    tiles_per_page: 24
    max_pages: 4
    slow_record_ms: 50.0
    slow_render_s: 5.0
ocr_routes:
    order_ticket: det
    order_sticker: det
ticket_parser: legacy
cloud_upload:
    enabled: false
    at: 01:00
    window_min: 120
    store_code: ''
    folders:
    - event
    - full_screen
    module_dir: aibox_uploader
    retry_sec: 300
