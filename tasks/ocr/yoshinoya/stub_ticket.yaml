# ==============================================================================
# 吉野家 客戶聯小票（stub / small_order_ticket）解析與設定
# ==============================================================================
enabled: false

# MMR 物件偵測類別名稱（對應 classes.yaml 中 id=9 的 small_order_ticket）
class_name: "small_order_ticket"

# 追蹤與 OCR 重試設定
stable_frames: 2          # 靜止幾幀才送 OCR
max_attempts: 3           # 解析失敗最多重送幾次 OCR

# MMR 階段 CV 補強設定（stub_cv_det.enhance_stub_detections）
mmr_cv_enhance:
  enable_candidate_fallback: false   # 當僅有主傳票而無 stub 時，是否從主傳票頂部推算候選框（720 板子 11 類模型已原生偵測 class 9，可依需求開啟）
  enable_full_image_fallback: false  # 當全畫面無任何偵測框時，是否以白紙邊界偵測作為候選框
  enable_roi_refinement: false       # 是否對已偵測到的 stub 框套用白紙邊界緊貼修正

# 客戶聯版面與解析設定
layout:
  max_tilt_deg: 25.0
  row_y_overlap: 0.45
  qty_min_x_ratio: 0.55
  qty_default_x_ratio: 0.87
  qty_max_width_ratio: 0.25
  header_max_y_ratio: 0.28
  footer_min_y_ratio: 0.82
  fuzzy_cutoff: 55.0

  # 表頭 / 表尾雜訊過濾關鍵字
  noise_keywords:
    - "テーブル"
    - "ﾃｰﾌﾞﾙ"
    - "人数"
    - "伝票"
    - "合計"
    - "小計"
    - "預り"
    - "お釣"
    - "釣り"
    - "領収"
    - "番号"
    - "No"
    - "NO"
    - "係"
    - "担当"
    - "レジ"
    - "税込"
    - "税抜"
    - "内税"
    - "外税"
    - "対象"
    - "点"
    - "名"

  # 細長字體數量誤判校正（例如吉野家小票細長字體 '1' 常被解碼為 '21'）
  qty_corrections:
    "21": 1

  # 易混淆 POS 代碼自動修正（OCR 常將 5 與 9、7 與 9 互換）
  pos_confusion:
    "9996": "5996"
    "5677": "9677"
    "9948": "9748"

  # 標準菜單名稱對應 4 碼 POS 代碼（當 4 碼 POS 被黑塊遮擋或模糊時，依匹配到的品名補齊 POS 碼）
