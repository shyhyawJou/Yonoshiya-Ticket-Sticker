# menu_modifiers.yaml —— 吉野家的「傳票修飾列」台帳
#
# 解決的問題（2026-09-21 客戶回報）
# ---------------------------------------------------------------------------
# 套餐附湯，但客人可以換湯。POS 會在傳票上**套餐的下方**另外印一列：
#
#     牛丼・並                 1
#     牛丼お新香みそ汁セット      1
#     変更しじみ汁              1      <- 修飾列
#
# menus_mapping.yaml 把 `変更しじみ汁` 當成獨立品項（貼紙 `※変更しじみ`），
# 所以「代入的湯」本來就會正確展開。這份台帳補的是另一半：**把套餐裡那碗
# みそ汁 從需求裡扣掉**。不扣的後果：
#
#   1. 前端顯示「一份餐 + 兩種湯」（客戶抱怨的表徵）
#   2. 店家換湯後**不會印原本那碗湯的貼紙**（2026-09-21 客戶確認），
#      所以 みそ汁 永遠等不到，這筆訂單到不了 TRAY_COMPLETED —— 這才是重點
#
# 跟其他三份 yaml 的分工
# ---------------------------------------------------------------------------
#   ../ja_ticket_grammar.yaml  通用日文文法（`変更X` / `Xに変更` / `変)X`）。
#                              只做提案，不做認定。
#   menus_mapping.yaml         客戶 xlsx 的忠實投影，會被工具整份重產，
#                              **任何人工判斷都不可以寫進去**。
#   menu_aliases.yaml          菜名身份（同菜異寫）的人工台帳。
#   menu_modifiers.yaml        本檔案：哪些列是修飾列、換掉的是哪一軸。
#
# 為什麼認定要人工做一次
# ---------------------------------------------------------------------------
# 光看字串分不出軸。實際資料裡 `変更半熟` 的貼紙就是 `半熟玉子`，跟單品的
# `半熟玉子` 一模一樣 —— 「把套餐的玉子換成半熟」還是「加點一份半熟玉子」，
# 字串上無法區分。所以文法只用來提醒「這裡有一筆沒歸軸的」，決定由人下。
#
# 維護流程
# ---------------------------------------------------------------------------
#   客戶 xlsx 改版 -> 重產 menus_mapping.yaml -> 跑
#       python3 tools/verify_menu_modifiers.py --brand yoshinoya
#   它會把「文法上像修飾列、但台帳沒登記」的列印成可直接貼進這裡的提案。
#   確認不是修飾列的，寫進 not_modifier —— 那是結案記錄，目的是停止重複詢問。

# ---------------------------------------------------------------------------
# 軸：一個「可以被替換的槽位」
# ---------------------------------------------------------------------------
# slots 是**貼紙側**的菜名（menus_mapping.yaml 的 sub_items 寫法），因為
# 要被扣掉的就是套餐的 sub_item。載入時會過等價層折成代表菜名，所以照
# xlsx 的寫法寫就好。
#
# 刻意明列而不用「含『汁』就算湯」這種規則：菜單裡有 `汁なし担々麺` 與
# `ミニ汁なし担々麺`，那是麵不是湯，規則會把它們一起換掉。
axes:
  - name: soup
    display: 湯品
    decided_by: chris.fan
    decided_at: 2026-09-21
    # 實測自 menus_mapping.yaml：みそ汁 出現在 31 個套餐裡，是最常被換的那個。
    # `しじみ` 與 `しじみ汁` 兩種寫法都收 —— xlsx 兩種都有，而等價層不會把
    # 它們折在一起（差一個「汁」字，fold 規則折不到）。
    slots:
      - みそ汁
      - 豚汁
      - しじみ
      - しじみ汁
      - あさり汁
      - 冷汁
      - 純豆腐スープ
    # ---- 2026-10-28 客戶說明 ---------------------------------------------
    # POS 可能把所有變更品項印在傳票最下面，所以換湯不再對應「正上方那個套餐」：
    # 看到變更湯，就在這張傳票裡找一碗**套餐附的**みそ汁刪掉。
    #   anchor        nearest_above = 只往上找最近的套餐（2026-09-21 的印法）
    #                 anywhere      = 先往上找最近的，上面沒有再往下找
    #                 刪哪一個套餐的湯對核對結果沒有差別，只影響顯示上是哪一份少了湯。
    #   remove_slots  變更時實際要刪的湯（上面的 slots 是「哪些貼紙算湯」的完整定義，
    #                 認出修飾列要用，兩者分開）。客戶目前只說了 みそ汁；附 豚汁 的套餐
    #                 （牛丼お新香とん汁ｾｯﾄ 等）看到變更湯不刪。單點的湯一律不刪。
    #                 之後要加，照 slots 的寫法加進來即可；同一張傳票同時有兩種可刪的湯時，
    #                 會先刪上方最近的那一碗 —— 遇到時要拿實際傳票再確認規則。
    #   show_removed  被刪的那碗要不要照樣送前端（客戶還在討論，現場有時兩張貼紙都會貼）
    #                 false = 前端不列；貼了みそ汁 會報錯誤品項（因為照理不會印）
    #                 true  = 前端照樣列出；貼了算 OK、不貼也能完成（不算完成條件）
    #                 兩種都會在 TICKET_READY 的 substitutions 帶 from / to / displayed。
    anchor: anywhere
    remove_slots:
      - みそ汁
    show_removed: false

  # --------------------------------------------------------------------
  # 以下三軸是**提案，尚未啟用**。機制已經做好，確認後把註解拿掉即可。
  # 每一軸啟用前要確認的是同一個問題：
  #   「換了之後，套餐原本那一份的貼紙還會不會印？」
  # 會印 -> 不該扣（不是替換，是加點）；不印 -> 該扣。
  # 湯軸是 2026-09-21 由 chris.fan 確認「不會印」才啟用的。
  # --------------------------------------------------------------------
  #
  # - name: rice
  #   display: 飯
  #   slots:
  #     - ご飯
  #     - 麦ごはん
  #     - ご飯大
  #     - ご飯大盛
  #     - ご飯大盛り
  #     - ご飯少なめ
  #     - ご飯軽め
  #     - 麦ご飯大盛
  #     - 麦ご飯少なめ
  #   # 注意：`追い飯`（吃完丼飯後追加的白飯）不是套餐的主飯，不要放進來。
  #   #      `ご飯増量` / `鰻ご飯増量` 已經在 menu_aliases.yaml 被判定為
  #   #      不同商品（distinct），放進同一軸要另外想清楚。
  #
  # - name: side
  #   display: 配菜
  #   slots:
  #     - お新香
  #     - キムチ
  #     - サラダ
  #     - ポテトサラダ
  #     - ミニサラダ
  #     - とろろ
  #
  # - name: egg
  #   display: 玉子
  #   slots:
  #     - 玉子
  #     - オム玉子

# ---------------------------------------------------------------------------
# 修飾列台帳：哪些傳票菜名是「修改別列」而不是「獨立一道菜」
# ---------------------------------------------------------------------------
# ticket 必須是 menus_mapping.yaml 裡的傳票 name 原字串（載入時會正規化）。
# axis 指向上面的軸。
#
# 登記在這裡的列**仍然照常展開成待核對項目** —— `変更しじみ汁` 的貼紙
# `※変更しじみ` 是真的會印出來、要核對的。登記只代表「這一列**額外**會
# 扣掉某個套餐的一個槽位」（找哪個套餐、扣哪一種見上面湯軸的 anchor / remove_slots）。
substitutions:
  - ticket: 変更しじみ汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更とん汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更あさり汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更冷汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更純豆腐
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
    note: 貼紙印「変更純豆腐S」，沒有 ※ 前綴，但同樣是換湯
  - ticket: D)変更豚汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
    note: D) = 外送通路，與店內的 変更とん汁 是兩筆各自獨立的菜單品項
  # 「Xに変更」是舊 xlsx 的寫法。2026-09-21 的版本只留下 冷汁に変更，
  # 其餘三筆已不在菜單裡 —— 但人工判定不會因為 xlsx 改版而失效，所以保留。
  # verify_menu_modifiers.py 會把它們列在「台帳有、目前菜單沒有」區塊（不是錯誤）。
  - ticket: 冷汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: しじみ汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: とん汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: あさり汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21

# ---------------------------------------------------------------------------
# 已判定「不是修飾列」的列
# ---------------------------------------------------------------------------
# 跟 menu_aliases.yaml 的 distinct 一樣，這不是待辦清單，是**結案記錄**：
# 寫進來之後 verify_menu_modifiers.py 就不會再把它當成待歸軸的提案。
#
# 目前吉野家還沒有這類 —— 文法命中的 25 列全部都是真的修飾列，其中
# 湯軸 10 筆已啟用，飯/配菜/玉子軸的 15 筆等上面的軸確認後一併登記。
not_modifier: []

# ---------------------------------------------------------------------------
# 套餐的主餐 size 印在下一列（2026-10-28 客戶說明，菜單無法改，只能硬做）
# ---------------------------------------------------------------------------
# 套餐名稱太長時，主餐的 size 會被印到下一列：
#
#     1 D)ﾁｰｽﾞ牛丼ｻﾗﾀﾞS          <- 套餐：貼紙只有 サラダ、みそ汁，沒有主餐
#     1   並                   <- 主餐的 size
#
# `並` 在 menus_mapping.yaml 是一對多（一般牛丼 / チーズ牛丼 / 牛丼+ねぎ / 明太高菜マヨ牛丼），
# 不處理的話任一種都算完成、前端也只能顯示其中一種。這裡用「size 列上方最近的套餐」的
# 名稱決定它是哪一種主餐，只留那一種。
#
#   size_rows     只有 size 的傳票品名。`並盛` 這類帶「盛」的寫法已被等價層折成 `並`，不用另外列
#   size_suffixes 從主餐貼紙去掉 size 時另外要認得的字：`チーズ牛丼並盛` 的「盛」、
#                 `明太高菜マヨ牛丼頭` 的「頭」（アタマ 的另一種寫法）
#   set_markers   套餐的標記：去掉 D) 這類通路前綴後，名稱**開頭或結尾**是這些字就是套餐
#                 （`牛丼お新香みそ汁ｾｯﾄ`、`D)ﾁｰｽﾞ牛丼ｻﾗﾀﾞS`、`ｾｯﾄポテトみそ汁`）。
#                 只看頭尾：S 只有一個字，出現在中間的不算。2026-10 盤點命中 32 筆，全是套餐
#   mains         由上往下比對套餐名稱，第一條命中的決定主餐；set_contains 空的是預設（放最後）
#                   main  主餐貼紙去掉 size 後的名字
#                   with  同一份主餐另外會印的貼紙（沒有就不寫）
#
# 往上找套餐時跳過其他 size 列（`D)牛からペアｾｯﾄ` 下面接兩列 `並`）與換湯這類修飾列；
# 碰到第一個普通品項就停，那一列不是套餐就當作 size 列不屬於任何套餐。
# 找不到套餐、或規則對不上任何變體時不動作，維持原本的「任一種主餐都算」，只記 log。
set_size_rows:
  size_rows: [並, 大, 特, 小, アタマ, 超特]
  size_suffixes: [盛, 頭]
  set_markers: [セット, S]
  mains:
    - set_contains: [ﾁｰｽﾞ牛丼]
      main: ﾁｰｽﾞ牛丼
    - set_contains: [ねぎ玉牛丼]
      main: 牛丼
      with: [ねぎ]                 # 玉子 已經在套餐自己的貼紙裡
    - set_contains: [明高ﾏﾖ牛丼, 明太高菜ﾏﾖ牛丼]
      main: 明太高菜マヨ牛丼
      with: [明太高菜マヨ]
    - set_contains: []             # 其他套餐（牛丼お新香みそ汁ｾｯﾄ、牛からペアｾｯﾄ …）都是一般牛丼
      main: 牛丼
  # 客戶菜單（menus_mapping.yaml）還沒收錄、現場會出現的套餐。menus_mapping.yaml 由 xlsx
  # 重產、不可手改，所以先補在這裡；客戶菜單補上之後這裡要刪掉（重複時以客戶菜單為準）。
  extra_sets:
    - ticket: D)牛からペアｾｯﾄ
      sub_items: []                # 套餐本身不印貼紙：牛丼由下面的 size 列、唐揚げ６個 由獨立列帶出
      added_by: chris.fan
      added_at: 2026-10-28
      note: 現場傳票 319（special_test/20261001_150401_928_menu.jpg），實驗用
