# menu_modifiers.yaml —— 吉野家的「傳票修飾列」台帳
#
# 解決的問題（2026-09-21 客戶回報）
# ---------------------------------------------------------------------------
# 套餐附湯，但客人可以換湯。POS 會在傳票上**套餐的下方**另外印一列：
#
#     牛丼・並                 1
#     牛丼お新香みそ汁セット      1
#     変更しじみ汁              1      <- 修飾列
#
# menus_mapping.yaml 把 `変更しじみ汁` 當成獨立品項（貼紙 `※変更しじみ`），
# 所以「代入的湯」本來就會正確展開。這份台帳補的是另一半：**把套餐裡那碗
# みそ汁 從需求裡扣掉**。不扣的後果：
#
#   1. 前端顯示「一份餐 + 兩種湯」（客戶抱怨的表徵）
#   2. 店家換湯後**不會印原本那碗湯的貼紙**（2026-09-21 客戶確認），
#      所以 みそ汁 永遠等不到，這筆訂單到不了 TRAY_COMPLETED —— 這才是重點
#
# 跟其他三份 yaml 的分工
# ---------------------------------------------------------------------------
#   ../ja_ticket_grammar.yaml  通用日文文法（`変更X` / `Xに変更` / `変)X`）。
#                              只做提案，不做認定。
#   menus_mapping.yaml         客戶 xlsx 的忠實投影，會被工具整份重產，
#                              **任何人工判斷都不可以寫進去**。
#   menu_aliases.yaml          菜名身份（同菜異寫）的人工台帳。
#   menu_modifiers.yaml        本檔案：哪些列是修飾列、換掉的是哪一軸。
#
# 為什麼認定要人工做一次
# ---------------------------------------------------------------------------
# 光看字串分不出軸。實際資料裡 `変更半熟` 的貼紙就是 `半熟玉子`，跟單品的
# `半熟玉子` 一模一樣 —— 「把套餐的玉子換成半熟」還是「加點一份半熟玉子」，
# 字串上無法區分。所以文法只用來提醒「這裡有一筆沒歸軸的」，決定由人下。
#
# 維護流程
# ---------------------------------------------------------------------------
#   客戶 xlsx 改版 -> 重產 menus_mapping.yaml -> 跑
#       python3 tools/verify_menu_modifiers.py --brand yoshinoya
#   它會把「文法上像修飾列、但台帳沒登記」的列印成可直接貼進這裡的提案。
#   確認不是修飾列的，寫進 not_modifier —— 那是結案記錄，目的是停止重複詢問。

# ---------------------------------------------------------------------------
# 軸：一個「可以被替換的槽位」
# ---------------------------------------------------------------------------
# slots 是**貼紙側**的菜名（menus_mapping.yaml 的 sub_items 寫法），因為
# 要被扣掉的就是套餐的 sub_item。載入時會過等價層折成代表菜名，所以照
# xlsx 的寫法寫就好。
#
# 刻意明列而不用「含『汁』就算湯」這種規則：菜單裡有 `汁なし担々麺` 與
# `ミニ汁なし担々麺`，那是麵不是湯，規則會把它們一起換掉。
axes:
  - name: soup
    display: 湯品
    decided_by: chris.fan
    decided_at: 2026-09-21
    # 實測自 menus_mapping.yaml：みそ汁 出現在 31 個套餐裡，是最常被換的那個。
    # `しじみ` 與 `しじみ汁` 兩種寫法都收 —— xlsx 兩種都有，而等價層不會把
    # 它們折在一起（差一個「汁」字，fold 規則折不到）。
    slots:
      - みそ汁
      - 豚汁
      - しじみ
      - しじみ汁
      - あさり汁
      - 冷汁
      - 純豆腐スープ

  # --------------------------------------------------------------------
  # 以下三軸是**提案，尚未啟用**。機制已經做好，確認後把註解拿掉即可。
  # 每一軸啟用前要確認的是同一個問題：
  #   「換了之後，套餐原本那一份的貼紙還會不會印？」
  # 會印 -> 不該扣（不是替換，是加點）；不印 -> 該扣。
  # 湯軸是 2026-09-21 由 chris.fan 確認「不會印」才啟用的。
  # --------------------------------------------------------------------
  #
  # - name: rice
  #   display: 飯
  #   slots:
  #     - ご飯
  #     - 麦ごはん
  #     - ご飯大
  #     - ご飯大盛
  #     - ご飯大盛り
  #     - ご飯少なめ
  #     - ご飯軽め
  #     - 麦ご飯大盛
  #     - 麦ご飯少なめ
  #   # 注意：`追い飯`（吃完丼飯後追加的白飯）不是套餐的主飯，不要放進來。
  #   #      `ご飯増量` / `鰻ご飯増量` 已經在 menu_aliases.yaml 被判定為
  #   #      不同商品（distinct），放進同一軸要另外想清楚。
  #
  # - name: side
  #   display: 配菜
  #   slots:
  #     - お新香
  #     - キムチ
  #     - サラダ
  #     - ポテトサラダ
  #     - ミニサラダ
  #     - とろろ
  #
  # - name: egg
  #   display: 玉子
  #   slots:
  #     - 玉子
  #     - オム玉子

# ---------------------------------------------------------------------------
# 修飾列台帳：哪些傳票菜名是「修改別列」而不是「獨立一道菜」
# ---------------------------------------------------------------------------
# ticket 必須是 menus_mapping.yaml 裡的傳票 name 原字串（載入時會正規化）。
# axis 指向上面的軸。
#
# 登記在這裡的列**仍然照常展開成待核對項目** —— `変更しじみ汁` 的貼紙
# `※変更しじみ` 是真的會印出來、要核對的。登記只代表「這一列**額外**會
# 扣掉上方套餐的一個槽位」。
substitutions:
  - ticket: 変更しじみ汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更とん汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更あさり汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更冷汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: 変更純豆腐
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
    note: 貼紙印「変更純豆腐S」，沒有 ※ 前綴，但同樣是換湯
  - ticket: D)変更豚汁
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
    note: D) = 外送通路，與店內的 変更とん汁 是兩筆各自獨立的菜單品項
  # 「Xに変更」是舊 xlsx 的寫法。2026-09-21 的版本只留下 冷汁に変更，
  # 其餘三筆已不在菜單裡 —— 但人工判定不會因為 xlsx 改版而失效，所以保留。
  # verify_menu_modifiers.py 會把它們列在「台帳有、目前菜單沒有」區塊（不是錯誤）。
  - ticket: 冷汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: しじみ汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: とん汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21
  - ticket: あさり汁に変更
    axis: soup
    decided_by: chris.fan
    decided_at: 2026-09-21

# ---------------------------------------------------------------------------
# 已判定「不是修飾列」的列
# ---------------------------------------------------------------------------
# 跟 menu_aliases.yaml 的 distinct 一樣，這不是待辦清單，是**結案記錄**：
# 寫進來之後 verify_menu_modifiers.py 就不會再把它當成待歸軸的提案。
#
# 目前吉野家還沒有這類 —— 文法命中的 25 列全部都是真的修飾列，其中
# 湯軸 10 筆已啟用，飯/配菜/玉子軸的 15 筆等上面的軸確認後一併登記。
not_modifier: []
